<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Snake Game</title>
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background-color: #000;
      margin: 0;
      font-family: Arial, sans-serif;
      color: white;
      overflow: hidden;
    }

    canvas {
      background-color: #000;
      display: block;
      margin-bottom: 10px;
      border: 4px solid white;
    }

    #score {
      text-align: center;
      font-size: 20px;
      margin-bottom: 5px;
    }

    #gameOver {
      text-align: center;
      font-size: 24px;
      color: red;
      display: none;
      margin-bottom: 10px;
    }

    #controls {
      margin-bottom: 10px;
    }

    #controls button {
      padding: 8px 16px;
      font-size: 16px;
      margin: 0 5px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
    }

    /* Mobile controls */
    #mobileControls {
      position: fixed;
      width: 100%;
      bottom: 20px;
      left: 0;
      pointer-events: none; /* prevent blocking canvas */
    }

    #mobileControls button {
      width: 60px;
      height: 60px;
      font-size: 24px;
      background: rgba(255, 255, 255, 0.5);
      border: 2px solid white;
      border-radius: 10px;
      pointer-events: all;
      touch-action: none;
    }

    /* Left side controls (Up + Left) */
    #leftControls {
      position: absolute;
      bottom: 20px;
      left: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: center;
    }

    /* Right side controls (Down + Right) */
    #rightControls {
      position: absolute;
      bottom: 20px;
      right: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: center;
    }
  </style>
</head>
<body>
  
  <!-- Score and Game Over -->
  <div id="score">Score: 0</div>
  <div id="gameOver">Game Over!</div>

  

  <!-- Canvas -->
  <canvas id="gameCanvas" width="400" height="400"></canvas>
  
  <div><h4>Swipe / Press Keys to start</h4></div>
  <!-- Controls -->
  <div id="controls">
    <button id="pauseBtn">Pause</button>
    <button id="restartBtn">Restart</button>
  </div>

  <!-- Mobile controls -->
  <div id="mobileControls">
    <div id="leftControls">
      <button id="upBtn">↑</button>
      <button id="leftBtn">←</button>
    </div>
    <div id="rightControls">
      <button id="downBtn">↓</button>
      <button id="rightBtn">→</button>
    </div>
  </div>

  <script src="snake.js"></script>
</body>
</html>
